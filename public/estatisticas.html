<!DOCTYPE html>
<html lang="pt-br">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9119031167097610" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CurtoLink - Encurtador de Links Grátis e Rápido</title>
  <meta name="description" content="Encurte seus links de forma rápida e gratuita com o CurtoLink. Simples, prático e sem complicação.">
  <meta name="keywords" content="encurtador de link, encurtar url, link curto, encurtador gratis">
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 50px auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Estatísticas de Links</h1>
  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>URL Original</th>
        <th>Cliques</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

  <script>
    async function carregar() {
      const resposta = await fetch('/api/estatisticas');
      const links = await resposta.json();
      const tabela = document.getElementById('tabela');

      for (const codigo in links) {
        const link = links[codigo];
        tabela.innerHTML += `
          <tr>
            <td>${codigo}</td>
            <td>${link.url}</td>
            <td>${link.cliques}</td>
          </tr>
        `;
      }
    }

    carregar();
  </script>
</body>
</html>
