<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="google-site-verification" content="9y19WukSoXBED09GANY-ipXkhxs9pUVwf9btqD6_m0A" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9119031167097610" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CurtoLink - Encurtador de Links Grátis e Rápido</title>
  <meta name="description" content="Encurte seus links de forma rápida e gratuita com o CurtoLink. Simples, prático e sem complicação.">
  <meta name="keywords" content="encurtador de link, encurtar url, link curto, encurtador gratis">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 80px;
    }
    input {
      padding: 10px;
      width: 300px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
    }
    #resultado {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
 <h1>Encurtador de Links</h1>
<p>Encurte seus links de forma rápida, gratuita e sem cadastro.</p>
  <input type="text" id="urlInput" placeholder="Cole sua URL aqui">
  <button onclick="encurtar()">Encurtar</button>
  <div id="resultado"></div>

  <script>
    async function encurtar() {
      const url = document.getElementById('urlInput').value;

      const resposta = await fetch('/api/encurtar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
      });

      const dados = await resposta.json();

      document.getElementById('resultado').innerHTML =
        `Seu link curto: <a href="${dados.curto}" target="_blank">${dados.curto}</a>`;
    }
  </script>
  <footer style="margin-top: 40px; font-size: 12px;">
  <a href="/politica-privacidade.html">Política de Privacidade</a>
</footer>
</body>
</html>
