<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Encurtador de Links</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 80px;
    }
    input {
      padding: 10px;
      width: 300px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
    }
    #resultado {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Encurtador de Links</h1>
  <input type="text" id="urlInput" placeholder="Cole sua URL aqui">
  <button onclick="encurtar()">Encurtar</button>
  <div id="resultado"></div>

  <script>
    async function encurtar() {
      const url = document.getElementById('urlInput').value;

      const resposta = await fetch('/api/encurtar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
      });

      const dados = await resposta.json();

      document.getElementById('resultado').innerHTML =
        `Seu link curto: <a href="${dados.curto}" target="_blank">${dados.curto}</a>`;
    }
  </script>
</body>
</html>
